[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/ig"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

# Якщо хочеш, щоб плановий збір працював (коли це доступно):
# [[scheduled.functions]]
#   name = "refresh"
#   cron = "*/10 * * * *"
